<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتقال وجه | بانک من</title>
    <!-- لینک به استایل سراسری -->
    <link rel="stylesheet" href="styles.css">
    <!-- استایل‌های اختصاصی صفحه انتقال -->
    <style>
        /* ========== بخش انتقال ========== */
        .transfer-section {
            padding: 60px 0;
            background: radial-gradient(circle at center, rgba(212,175,55,0.08) 0%, transparent 70%);
        }

        .transfer-card {
            background-color: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--color-border);
            transition: background-color var(--transition-base);
        }

        .transfer-card h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .transfer-card p.subtitle {
            text-align: center;
            color: var(--color-text-secondary);
            margin-bottom: 35px;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-text);
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: 2px solid var(--color-border);
            background-color: var(--color-bg);
            color: var(--color-text);
            font-size: 1rem;
            transition: all var(--transition-fast);
            font-family: var(--font-family);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--color-gold);
            box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
            background-color: var(--color-surface);
        }

        .form-group input::placeholder {
            color: var(--color-text-secondary);
            opacity: 0.7;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-block {
            width: 100%;
            margin-top: 10px;
            padding: 16px;
            font-size: 1.1rem;
            border-radius: var(--radius-lg);
        }

        /* پیام وضعیت */
        .transfer-status {
            margin-top: 20px;
            padding: 15px;
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .transfer-status.success {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .transfer-status.error {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* ریسپانسیو */
        @media (max-width: 768px) {
            .transfer-card {
                padding: 25px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <!-- هدر (همانند صفحه اصلی) -->
    <header class="site-header">
        <div class="container">
            <div class="logo">
                <a href="index.html">بانک من</a>
            </div>
            <nav class="main-nav" aria-label="منوی اصلی">
                <ul>
                    <li><a href="dashboard.html">داشبورد</a></li>
                    <li><a href="transfer.html" class="active">انتقال وجه</a></li>
                    <li><a href="card-order.html">سفارش کارت</a></li>
                    <li><a href="loan.html">وام</a></li>
                    <li><a href="transactions.html">تراکنش‌ها</a></li>
                    <li><a href="admin.html">پنل مدیریت</a></li>
                </ul>
            </nav>
            <div class="user-actions">
                <a href="login.html" class="btn btn-outline">ورود</a>
                <a href="register.html" class="btn btn-primary">ثبت‌نام</a>
            </div>
        </div>
    </header>

    <!-- بخش اصلی -->
    <main>
        <section class="transfer-section">
            <div class="container">
                <div class="transfer-card">
                    <h1>انتقال کارت به کارت</h1>
                    <p class="subtitle">لطفاً اطلاعات زیر را با دقت وارد کنید</p>

                    <form id="transfer-form" novalidate>
                        <div class="form-group">
                            <label for="source-card">شماره کارت مبدأ</label>
                            <input type="text" id="source-card" name="sourceCard" placeholder="۱۶ رقم کارت" maxlength="16" inputmode="numeric" required>
                        </div>

                        <div class="form-group">
                            <label for="destination-card">شماره کارت مقصد</label>
                            <input type="text" id="destination-card" name="destinationCard" placeholder="۱۶ رقم کارت" maxlength="16" inputmode="numeric" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="amount">مبلغ (تومان)</label>
                                <input type="number" id="amount" name="amount" min="10000" step="10000" placeholder="مبلغ را وارد کنید" required>
                            </div>
                            <div class="form-group">
                                <label for="description">توضیحات (اختیاری)</label>
                                <input type="text" id="description" name="description" placeholder="مثلاً: پرداخت قبوض">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">انتقال وجه</button>
                    </form>

                    <div id="transfer-status" class="transfer-status"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- فوتر (همانند صفحه اصلی) -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 بانک من. تمامی حقوق محفوظ است.</p>
            <nav class="footer-nav">
                <ul>
                    <li><a href="about.html">درباره ما</a></li>
                    <li><a href="contact.html">تماس با ما</a></li>
                    <li><a href="privacy.html">حریم خصوصی</a></li>
                </ul>
            </nav>
        </div>
    </footer>

    <!-- لینک به اسکریپت سراسری (برای دارک مود و انیمیشن‌ها) -->
    <script src="script.js"></script>

    <!-- اسکریپت اختصاصی صفحه انتقال -->
    <script>
        (function() {
            const form = document.getElementById('transfer-form');
            const statusDiv = document.getElementById('transfer-status');

            // اعتبارسنجی ساده کارت‌ها
            function isValidCardNumber(cardNumber) {
                // فقط ۱۶ رقم
                if (!/^\d{16}$/.test(cardNumber)) {
                    return false;
                }
                // الگوریتم لان (Luhn) برای بررسی صحت کارت
                let sum = 0;
                let shouldDouble = false;
                for (let i = cardNumber.length - 1; i >= 0; i--) {
                    let digit = parseInt(cardNumber.charAt(i), 10);
                    if (shouldDouble) {
                        digit *= 2;
                        if (digit > 9) {
                            digit -= 9;
                        }
                    }
                    sum += digit;
                    shouldDouble = !shouldDouble;
                }
                return (sum % 10) === 0;
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                statusDiv.className = 'transfer-status'; // پاک کردن کلاس قبلی
                statusDiv.style.display = 'none';

                // دریافت مقادیر
                const sourceCard = document.getElementById('source-card').value.trim();
                const destinationCard = document.getElementById('destination-card').value.trim();
                const amount = document.getElementById('amount').value;

                // اعتبارسنجی
                if (!isValidCardNumber(sourceCard)) {
                    showStatus('شماره کارت مبدأ معتبر نیست.', 'error');
                    return;
                }
                if (!isValidCardNumber(destinationCard)) {
                    showStatus('شماره کارت مقصد معتبر نیست.', 'error');
                    return;
                }
                if (sourceCard === destinationCard) {
                    showStatus('شماره کارت مبدأ و مقصد نمی‌توانند یکسان باشند.', 'error');
                    return;
                }
                const amountNum = Number(amount);
                if (!amount || isNaN(amountNum) || amountNum < 10000) {
                    showStatus('مبلغ انتقال باید حداقل ۱۰,۰۰۰ تومان باشد.', 'error');
                    return;
                }

                // شبیه‌سازی انتقال موفق
                showStatus(`انتقال ${amountNum.toLocaleString('fa-IR')} تومان با موفقیت انجام شد.`, 'success');
                form.reset();
            });

            function showStatus(message, type) {
                statusDiv.textContent = message;
                statusDiv.className = 'transfer-status ' + type;
                statusDiv.style.display = 'block';
                // اسکرول به پیام
                statusDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // فیلتر ورودی کارت: فقط اعداد
            document.querySelectorAll('input[inputmode="numeric"]').forEach(input => {
                input.addEventListener('input', function() {
                    this.value = this.value.replace(/\D/g, '').slice(0, 16);
                });
            });
        })();
    </script>
</body>
</html>
