<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | بانک من</title>
    <!-- لینک به استایل سراسری -->
    <link rel="stylesheet" href="styles.css">
    <!-- استایل‌های اختصاصی صفحه ورود -->
    <style>
        /* ========== بخش ورود ========== */
        .login-section {
            padding: 80px 0;
            background: radial-gradient(circle at center, rgba(212,175,55,0.08) 0%, transparent 70%);
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
        }

        .login-card {
            background-color: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: 40px;
            max-width: 450px;
            margin: 0 auto;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--color-border);
            transition: background-color var(--transition-base);
        }

        .login-card h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .login-card p.subtitle {
            text-align: center;
            color: var(--color-text-secondary);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-text);
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: 2px solid var(--color-border);
            background-color: var(--color-bg);
            color: var(--color-text);
            font-size: 1rem;
            transition: all var(--transition-fast);
            font-family: var(--font-family);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-gold);
            box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
            background-color: var(--color-surface);
        }

        .form-group input::placeholder {
            color: var(--color-text-secondary);
            opacity: 0.7;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--color-text-secondary);
            cursor: pointer;
        }

        .remember-forgot input[type="checkbox"] {
            width: auto;
            accent-color: var(--color-gold);
        }

        .remember-forgot a {
            color: var(--color-gold-dark);
            font-weight: 600;
        }

        .remember-forgot a:hover {
            color: var(--color-gold);
        }

        .btn-block {
            width: 100%;
            margin-top: 10px;
            padding: 16px;
            font-size: 1.1rem;
            border-radius: var(--radius-lg);
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--color-text-secondary);
        }

        .register-link a {
            color: var(--color-gold-dark);
            font-weight: 600;
        }

        .register-link a:hover {
            color: var(--color-gold);
        }

        /* پیام وضعیت */
        .login-status {
            margin-top: 20px;
            padding: 15px;
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .login-status.success {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .login-status.error {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 25px;
            }
            .remember-forgot {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- هدر مشترک -->
    <header class="site-header">
        <div class="container">
            <div class="logo">
                <a href="index.html">بانک من</a>
            </div>
            <nav class="main-nav" aria-label="منوی اصلی">
                <ul>
                    <li><a href="dashboard.html">داشبورد</a></li>
                    <li><a href="transfer.html">انتقال وجه</a></li>
                    <li><a href="card-order.html">سفارش کارت</a></li>
                    <li><a href="loan.html">وام</a></li>
                    <li><a href="transactions.html">تراکنش‌ها</a></li>
                    <li><a href="admin.html">پنل مدیریت</a></li>
                </ul>
            </nav>
            <div class="user-actions">
                <a href="login.html" class="btn btn-outline">ورود</a>
                <a href="register.html" class="btn btn-primary">ثبت‌نام</a>
            </div>
        </div>
    </header>

    <!-- بخش اصلی -->
    <main>
        <section class="login-section">
            <div class="container">
                <div class="login-card">
                    <h1>ورود به حساب</h1>
                    <p class="subtitle">برای دسترسی به حساب بانکی خود وارد شوید.</p>

                    <form id="login-form" novalidate>
                        <div class="form-group">
                            <label for="email">ایمیل یا شماره موبایل</label>
                            <input type="text" id="email" name="email" placeholder="example@email.com یا 09123456789" required>
                        </div>

                        <div class="form-group">
                            <label for="password">رمز عبور</label>
                            <input type="password" id="password" name="password" placeholder="رمز عبور خود را وارد کنید" required>
                        </div>

                        <div class="remember-forgot">
                            <label>
                                <input type="checkbox" id="remember-me">
                                <span>مرا به خاطر بسپار</span>
                            </label>
                            <a href="#">فراموشی رمز عبور؟</a>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">ورود</button>
                    </form>

                    <div id="login-status" class="login-status"></div>

                    <p class="register-link">
                        حساب ندارید؟ <a href="register.html">ثبت‌نام کنید</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <!-- فوتر مشترک -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 بانک من. تمامی حقوق محفوظ است.</p>
            <nav class="footer-nav">
                <ul>
                    <li><a href="about.html">درباره ما</a></li>
                    <li><a href="contact.html">تماس با ما</a></li>
                    <li><a href="privacy.html">حریم خصوصی</a></li>
                </ul>
            </nav>
        </div>
    </footer>

    <!-- اسکریپت سراسری -->
    <script src="script.js"></script>

    <!-- اسکریپت اختصاصی صفحه ورود -->
    <script>
        (function() {
            const form = document.getElementById('login-form');
            const statusDiv = document.getElementById('login-status');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const rememberMe = document.getElementById('remember-me');

            // اعتبارسنجی ساده ایمیل یا موبایل
            function isValidEmailOrPhone(value) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const phoneRegex = /^09\d{9}$/;
                return emailRegex.test(value) || phoneRegex.test(value);
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                statusDiv.className = 'login-status';
                statusDiv.style.display = 'none';

                const emailOrPhone = emailInput.value.trim();
                const password = passwordInput.value;

                if (!emailOrPhone || !isValidEmailOrPhone(emailOrPhone)) {
                    showStatus('لطفاً یک ایمیل یا شماره موبایل معتبر وارد کنید.', 'error');
                    return;
                }
                if (!password || password.length < 8) {
                    showStatus('رمز عبور باید حداقل ۸ کاراکتر باشد.', 'error');
                    return;
                }

                // شبیه‌سازی ورود موفق
                if (rememberMe.checked) {
                    // در عمل اینجا ذخیره‌سازی انجام می‌شود
                    console.log('مرا به خاطر بسپار فعال است.');
                }
                showStatus('ورود موفقیت‌آمیز بود! در حال انتقال به داشبورد...', 'success');
                // شبیه‌سازی هدایت به داشبورد
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            });

            function showStatus(message, type) {
                statusDiv.textContent = message;
                statusDiv.className = 'login-status ' + type;
                statusDiv.style.display = 'block';
                statusDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        })();
    </script>
</body>
</html>
